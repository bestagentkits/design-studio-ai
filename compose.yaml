services:
  studio:
    build:
      context: .
      args:
        PUBLIC_SITE_URL: ${APP_URL:-http://localhost:8787}
    ports: ["8787:8787"]
    environment:
      APP_URL: ${APP_URL:-http://localhost:8787}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set a stable ENCRYPTION_KEY}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      OBSERVABILITY_ADMIN_IDS: ${OBSERVABILITY_ADMIN_IDS:-}
      POSTHOG_PROJECT_KEY: ${POSTHOG_PROJECT_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-}
      GITHUB_CONNECTOR_CLIENT_ID: ${GITHUB_CONNECTOR_CLIENT_ID:-}
      GITHUB_CONNECTOR_CLIENT_SECRET: ${GITHUB_CONNECTOR_CLIENT_SECRET:-}
      GITHUB_CONNECTOR_APP_ID: ${GITHUB_CONNECTOR_APP_ID:-}
      GITHUB_CONNECTOR_PRIVATE_KEY: ${GITHUB_CONNECTOR_PRIVATE_KEY:-}
      GITHUB_CONNECTOR_WEBHOOK_SECRET: ${GITHUB_CONNECTOR_WEBHOOK_SECRET:-}
      GOOGLE_CONNECTOR_CLIENT_ID: ${GOOGLE_CONNECTOR_CLIENT_ID:-}
      GOOGLE_CONNECTOR_CLIENT_SECRET: ${GOOGLE_CONNECTOR_CLIENT_SECRET:-}
      GOOGLE_PICKER_API_KEY: ${GOOGLE_PICKER_API_KEY:-}
      GOOGLE_PICKER_APP_ID: ${GOOGLE_PICKER_APP_ID:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-}
    volumes: ["studio-data:/data"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
volumes:
  studio-data:

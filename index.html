<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <script>
      (() => {
        let preference = 'system';
        try { const saved = localStorage.getItem('design-studio:appearance'); if (saved === 'light' || saved === 'dark') preference = saved; } catch {}
        const theme = preference === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.appearancePreference = preference;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <meta name="theme-color" content="#f6f5f1" />
    <meta name="application-name" content="Design Studio AI" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <meta
      name="description"
      content="An open design workspace for ideas, people, and agents. Create websites, presentations, documents, 3D scenes, and motion."
    />
    <title>Design Studio AI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

name: Verify and deploy beta
on:
  push:
    branches: [dev]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix packages/cli
      - run: npx playwright install --with-deps chromium
      - run: npm run build:cli
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          PUBLIC_SITE_URL: https://beta.studio.agentkit.best
      - run: npm run pack:skill
      - run: npm run test:e2e
        env:
          CONNECTORS_ENABLED: "true"
      - run: npm pack
        working-directory: packages/cli
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        with:
          name: beta-assets
          path: dist
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: cloudflare-beta
      cancel-in-progress: false
    environment:
      name: beta
      url: https://beta.studio.agentkit.best
    steps:
      - uses: actions/checkout@v4
      - name: Check this is still the dev head
        id: head
        shell: bash
        run: |
          remote_head=$(git ls-remote --exit-code origin refs/heads/dev | cut -f1)
          if [ "$remote_head" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipping superseded dev commit.'
          fi
      - uses: actions/setup-node@v4
        if: steps.head.outputs.current == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.head.outputs.current == 'true'
      - uses: actions/download-artifact@v4
        if: steps.head.outputs.current == 'true'
        with:
          name: beta-assets
          path: dist
      - name: Apply migrations and deploy verified revision
        if: steps.head.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm run cf -- d1 migrations apply design-studio-ai-beta --remote --env beta
          npm run cf -- deploy --env beta --keep-vars --message "$GITHUB_SHA"
      - name: Verify public beta endpoints
        if: steps.head.outputs.current == 'true'
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const origin = 'https://beta.studio.agentkit.best';
          const read = async path => {
            const response = await fetch(origin + path, { redirect: 'error', signal: AbortSignal.timeout(15000) });
            assert.equal(response.status, 200);
            return response.json();
          };
          // A newly provisioned custom domain may still be propagating DNS and TLS.
          for (let attempt = 1; ; attempt++) {
            try {
              assert.equal((await read('/api/health')).ok, true);
              assert.equal((await read('/.well-known/oauth-protected-resource/mcp')).resource, origin + '/mcp');
              assert.equal((await read('/.well-known/oauth-authorization-server')).authorization_endpoint, origin + '/oauth/authorize');
              console.log('Beta health and OAuth discovery passed.');
              break;
            } catch (error) {
              if (attempt >= 12) throw error;
              console.log(`Beta not ready (attempt ${attempt}/12); retrying in 10 seconds.`);
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
          }
          NODE
